<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا | LUXURY</title>
  <link rel="stylesheet" href="../libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../libs/toast-notification/toast-notification.css">
  <link rel="stylesheet" href="../libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="contact-page">
<header class="site-header">
  <div class="header-inner">
    <h1 class="brand-name">LUXURY</h1>
  </div>
</header>
<nav class="main-nav">
  <ul>
      <li><a href="../index.html">الرئيسية</a></li>
      <li><a href="products.html">المنتجات</a></li>
      <li><a href="about.html">من نحن</a></li>
      <li><a href="contact.html" class="active">تواصل معنا</a></li>
      <li><a href="login.html">تسجيل الدخول</a></li>
      <li><a href="register.html">إنشاء حساب</a></li>
  </ul>
</nav>
<main class="container">
  <div class="page-title">
    <h2>تواصل معنا</h2>
    <p>يسعدنا تواصلك معنا.</p>
  </div>
  <div class="contact-grid">
    <section class="section-card">
      <h3>أرسل رسالة</h3>
      <form id="contactForm" class="needs-validation" novalidate>
      <div class="mb-3">
        <label class="form-label" for="contactName">الاسم</label>
        <input class="form-control" id="contactName" type="text" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="contactEmail">البريد الإلكتروني</label>
        <input class="form-control" id="contactEmail" type="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="contactMessage">الرسالة</label>
        <textarea class="form-control" id="contactMessage" rows="4" required></textarea>
      </div>
        <button class="btn btn-dark" type="submit">إرسال</button>
      </form>
    </section>
    <section class="section-card">
      <h3>بيانات التواصل</h3>
      <ul class="contact-list">
        <li><i class="fa-solid fa-phone"></i> <strong>رقم الهاتف:</strong> 777777777</li>
        <li><i class="fa-solid fa-envelope"></i> <strong>البريد الإلكتروني:</strong> luxury.store@gmail.com</li>
        <li><i class="fa-brands fa-instagram"></i> <strong>إنستغرام:</strong> luxury.store</li>
      </ul>
    </section>
  </div>
</main>
<footer class="site-footer">
  <p>LUXURY</p>
</footer>
<script src="../libs/jquery/jquery.min.js"></script>
<script src="../libs/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../libs/toast-notification/toast-notification.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
