<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | LUXURY</title>
  <link rel="stylesheet" href="../libs/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../libs/toast-notification/toast-notification.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page">
<header class="site-header">
  <div class="header-inner">
    <h1 class="brand-name">LUXURY</h1>
  </div>
</header>
<nav class="main-nav">
  <ul>
      <li><a href="../index.html">الرئيسية</a></li>
      <li><a href="products.html">المنتجات</a></li>
      <li><a href="about.html">من نحن</a></li>
      <li><a href="contact.html">تواصل معنا</a></li>
      <li><a href="login.html" class="active">تسجيل الدخول</a></li>
      <li><a href="register.html">إنشاء حساب</a></li>
  </ul>
</nav>
<main class="container">
  <div class="page-title">
    <h2>تسجيل الدخول</h2>
    <p>مرحبًا بك في متجر LUXURY للهواتف الذكية.</p>
  </div>
  <section class="section-card form-card">
    <form id="loginForm" class="needs-validation" novalidate>
      <div class="mb-3">
        <label class="form-label" for="loginEmail">البريد الإلكتروني</label>
        <input class="form-control" id="loginEmail" type="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="loginPassword">كلمة المرور</label>
        <input class="form-control" id="loginPassword" type="password" minlength="6" required>
      </div>
      <button class="btn btn-dark" type="submit">تسجيل الدخول</button>
    </form>
  </section>
</main>
<footer class="site-footer">
  <p>LUXURY</p>
</footer>
<script src="../libs/jquery/jquery.min.js"></script>
<script src="../libs/bootstrap/bootstrap.bundle.min.js"></script>
<script src="../libs/toast-notification/toast-notification.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
